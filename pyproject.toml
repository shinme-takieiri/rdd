[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reve"
version = "0.1.0"
description = "Assistant de règles pour Rêve de Dragon : moteur de jets déterministe"
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
